version: '3.8'

services:

  # ── MySQL Database ──────────────────────────────────────
  db:
    image: mysql:8.0          # pulls official MySQL image from Docker Hub
    container_name: agrilink_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: agrilink_db

    ports:
      - "3307:3306"           # maps host port 3307 to container port 3306
      # 3307 so it doesn't conflict with your local MySQL
    volumes:
      - agrilink_db_data:/var/lib/mysql   # persists data even when container stops
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # ── Spring Boot Backend ─────────────────────────────────
  backend:
    build:
      context: .              # build using Dockerfile in current directory
      dockerfile: Dockerfile
    container_name: agrilink_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
        SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/agrilink_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: ${DB_ROOT_PASSWORD}
        JWT_SECRET: ${JWT_SECRET}
        JWT_EXPIRATION: 86400000
        AGRILINK_DEFAULT_AGENT_ID: AGA-ADMIN001
        AGRILINK_COMMISSION_RATE: 0.05
        AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME}
        AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY}
        AFRICASTALKING_SENDER_ID: AgriLink
        PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
        ADMIN_EMAIL: ${ADMIN_EMAIL}
        ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy   # wait for MySQL to be ready before starting
    volumes:
      - ./logs:/app/logs

  # ── React Frontend ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: agrilink_frontend
    restart: unless-stopped
    ports:
      - "80:80"               # frontend available at http://localhost
    depends_on:
      - backend


volumes:
  agrilink_db_data:           # this persists your database data